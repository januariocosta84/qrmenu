# QR Menu site (Apache), rendered by deploy/setup.sh. __DOMAIN__/__PORT__/__APP__/__MEDIA__ are filled in.
# Self-contained virtual hosts for one domain; no global settings are changed here.
<VirtualHost *:80>
    ServerName __DOMAIN__
    # Certificate renewals (certbot webroot); everything else goes to HTTPS.
    Alias /.well-known/acme-challenge/ /var/www/qrmenu-acme/.well-known/acme-challenge/
    <Directory /var/www/qrmenu-acme>
        Require all granted
        Options -Indexes
    </Directory>
    RedirectMatch 301 "^/(?!\.well-known/acme-challenge/)(.*)$" "https://__DOMAIN__/$1"
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName __DOMAIN__
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/__DOMAIN__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__DOMAIN__/privkey.pem

    LimitRequestBody 6291456

    Alias /static/ __APP__/staticfiles/
    <Directory __APP__/staticfiles>
        Require all granted
        Options -Indexes
    </Directory>
    Alias /media/ __MEDIA__/
    <Directory __MEDIA__>
        Require all granted
        Options -Indexes -ExecCGI
        RemoveHandler .php .phtml .py .pl .cgi .sh
        <FilesMatch "\.(php|phtml|py|pl|cgi|sh|html?)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Only proxy + proxy_http are needed (no mod_headers): the app is started with
    # ASSUME_HTTPS=1 because it is reachable only through this HTTPS virtual host.
    ProxyPreserveHost On
    ProxyPass        /static/ !
    ProxyPass        /media/ !
    # upgrade=websocket (Apache 2.4.47+) carries the live kitchen/order updates.
    ProxyPass        / http://127.0.0.1:__PORT__/ upgrade=websocket timeout=3600
    ProxyPassReverse / http://127.0.0.1:__PORT__/

    ErrorLog  ${APACHE_LOG_DIR}/qrmenu-error.log
    CustomLog ${APACHE_LOG_DIR}/qrmenu-access.log combined
</VirtualHost>
</IfModule>
