# QR Menu site, rendered by deploy/setup.sh (__DOMAIN__ / __PORT__ are filled in).
# Self-contained: unique upstream and variable names so it can't clash with other sites on the server.
upstream qrmenu_upstream {
    server 127.0.0.1:__PORT__;
}

map $http_upgrade $qrmenu_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/qrmenu-acme; }   # certificate renewals
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    # Certificate obtained by deploy/setup.sh (certbot certonly); renewed automatically.
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    client_max_body_size 6m;   # matches the 5 MB image limit

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias __APP__/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias __MEDIA__/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        # Uploaded images are re-encoded to WebP; never execute anything here.
        location ~* \.(php|py|sh|html?)$ { deny all; }
    }

    location /ws/ {
        proxy_pass http://qrmenu_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $qrmenu_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://qrmenu_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
