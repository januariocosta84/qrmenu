# /etc/nginx/sites-available/qrmenu  (installed by deploy/setup.sh; certbot then manages the SSL lines)
upstream qrmenu_app {
    server 127.0.0.1:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name qrmenu.timorstore.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name qrmenu.timorstore.com;

    # Certificates from certbot: sudo certbot --nginx -d qrmenu.timorstore.com
    ssl_certificate     /etc/letsencrypt/live/qrmenu.timorstore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qrmenu.timorstore.com/privkey.pem;

    client_max_body_size 6m;   # matches the 5 MB image limit

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /srv/qrmenu/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/qrmenu/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        # Uploaded images are re-encoded to WebP; never execute anything here.
        location ~* \.(php|py|sh|html?)$ { deny all; }
    }

    location /ws/ {
        proxy_pass http://qrmenu_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://qrmenu_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
