{# Small flag for a dashboard language code (en, pt, tet, id). Inline SVG: emoji flags don't show on Windows. #}<span class="flag" aria-hidden="true">{% if code == "pt" %}<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#DA291C"/><rect width="12" height="20" fill="#046A38"/><circle cx="12" cy="10" r="4.6" fill="#FFE900"/><path d="M10 7.6h4v3.6a2 2 0 0 1-4 0z" fill="#fff" stroke="#DA291C" stroke-width=".9"/></svg>{% elif code == "tet" %}<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#DC241F"/><path d="M0 0L16 10L0 20z" fill="#FFC726"/><path d="M0 0L10.5 10L0 20z" fill="#000"/><polygon points="4.54,7.72 4.57,9.44 6.20,10.00 4.57,10.56 4.54,12.28 3.51,10.90 1.86,11.41 2.85,10.00 1.86,8.59 3.51,9.10" fill="#fff"/></svg>{% elif code == "id" %}<svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><rect width="30" height="10" fill="#CE1126"/></svg>{% else %}<svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice"><clipPath id="flag-uk-t"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><path d="M0,0v30h60v-30z" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#flag-uk-t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg>{% endif %}</span>
